# Permanent redirects for routes moved in the dual-edition restructure (2026-10-21).
# Installed to /etc/nginx/snippets/iai-www-redirects.conf by deploy/remote-install.sh and
# included from the www server block:  include snippets/iai-www-redirects.conf;
# Keep in sync with site/src/pages/<old>.astro redirect stubs; check-site.mjs verifies both sides.

location ~ ^/deployment/?$ { return 301 /enterprise/deployment/; }
location ~ ^/security/?$ { return 301 /enterprise/security/; }
location ~ ^/solutions/?$ { return 301 /enterprise/solutions/; }
location ~ ^/contact/?$ { return 301 /enterprise/contact/; }
